  <text x="50" y="248" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">🎯 Jira Velocity</text>
  <text x="50" y="286" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">⏱ Pomodoro Focus</text>
  <text x="50" y="324" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">🔐 DPAPI Keyring</text>

  <!-- Telemetry Widget in Sidebar -->
  <rect x="30" y="520" width="196" height="120" rx="8" fill="#090d16" stroke="#1e293b"/>

    <!-- Column 1: TODO -->
    <rect x="0" y="0" width="300" height="486" rx="10" fill="url(#cardGrad)" stroke="#1e293b"/>
    <text x="18" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">📋 TO DO (3)</text>

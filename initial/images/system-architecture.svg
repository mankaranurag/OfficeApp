<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="boxReact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="boxRust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="boxSqlite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="boxWin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="14" fill="url(#bgArch)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="55" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" text-anchor="middle">DEVPULSE — SYSTEM ARCHITECTURE & DATA FLOW</text>
  <text x="600" y="82" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">Ultra-low footprint (&lt;15MB RAM) Windows 11 Native Architecture</text>

  <!-- Layer 1: Presentation Layer (React 19 + Tailwind v4 + Vite) -->
  <g transform="translate(100, 120)">
    <rect width="1000" height="90" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="10" height="90" rx="4" fill="url(#boxReact)"/>
    <text x="30" y="35" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">1. PRESENTATION LAYER (React 19 + TypeScript + Tailwind CSS v4)</text>
    <text x="30" y="65" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="13">Kanban Board • Git PR Stream • Jira Velocity Matrix • Pomodoro HUD • Sub-millisecond Local State</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 600 210 L 600 250" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="600,256 594,244 606,244" fill="#38bdf8"/>
  <text x="615" y="236" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">IPC Commands (invoke / emit)</text>

  <!-- Layer 2: Native Bridge (Tauri Rust Core) -->
  <g transform="translate(100, 260)">
    <rect width="1000" height="90" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <rect width="10" height="90" rx="4" fill="url(#boxRust)"/>
    <text x="30" y="35" fill="#f97316" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">2. NATIVE CORE BRIDGE (Tauri 1.5 + Rust 2021 Edition)</text>
    <text x="30" y="65" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="13">System Tray Event Dispatcher • Background Worker Threads • Memory Telemetry Poller • DPAPI Vault Broker</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 350 350 L 350 390" stroke="#22c55e" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="350,396 344,384 356,384" fill="#22c55e"/>

  <path d="M 850 350 L 850 390" stroke="#a855f7" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="850,396 844,384 856,384" fill="#a855f7"/>

  <!-- Layer 3A: Embedded Offline Engine -->
  <g transform="translate(100, 400)">
    <rect width="480" height="110" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <rect width="10" height="110" rx="4" fill="url(#boxSqlite)"/>
    <text x="30" y="35" fill="#22c55e" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">3A. EMBEDDED SQLITE WAL ENGINE</text>
    <text x="30" y="65" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Write-Ahead Logging (WAL) • Sub-0.4ms Local Query Latency</text>
    <text x="30" y="88" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Zero Network Dependency • Automatic Outbox Replay Queue</text>
  </g>

  <!-- Layer 3B: Windows 11 Fluent OS APIs -->
  <g transform="translate(620, 400)">
    <rect width="480" height="110" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <rect width="10" height="110" rx="4" fill="url(#boxWin)"/>
    <text x="30" y="35" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">3B. WINDOWS 11 INTEGRATION</text>
    <text x="30" y="65" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Mica &amp; Acrylic Translucent Composition • Window Vibrancy API</text>
    <text x="30" y="88" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Windows Data Protection API (DPAPI) • System Tray Daemon</text>
  </g>

  <!-- Layer 4: Cloud Sync & Security -->
  <g transform="translate(100, 540)">
    <rect width="1000" height="90" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="35" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">4. CLOUD SYNCHRONIZATION PIPELINES (Async Background Engine)</text>
    <text x="30" y="65" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">GitHub REST &amp; GraphQL API (Commits, PRs, CI Runs) • Atlassian Jira Agile API (Issues, Sprints, Velocity)</text>
  </g>
</svg>

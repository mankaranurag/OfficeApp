<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="jiraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="14" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="55" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" text-anchor="middle">GIT COMMITS &amp; JIRA SPRINTS AUTOMATED PIPELINE</text>
  <text x="600" y="82" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14" text-anchor="middle">Bidirectional Sync with Outbox Queue &amp; Conflict Resolution</text>

  <!-- Source 1: GitHub -->
  <g transform="translate(120, 130)">
    <rect width="280" height="200" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="url(#gitGrad)"/>
    <text x="70" y="46" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">GitHub Cloud</text>
    <text x="25" y="85" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• Real-time Webhooks &amp; Polling</text>
    <text x="25" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• Pull Request Review State</text>
    <text x="25" y="135" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• CI/CD GitHub Actions Status</text>
    <text x="25" y="160" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• Branch Commit Stream</text>
  </g>

  <!-- Central Hub: DevPulse Windows 11 Engine -->
  <g transform="translate(460, 190)">
    <rect width="280" height="280" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="140" cy="50" r="24" fill="#38bdf8"/>
    <text x="140" y="58" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" text-anchor="middle">⚡</text>
    <text x="140" y="105" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" text-anchor="middle">DevPulse Engine</text>
    
    <rect x="25" y="130" width="230" height="40" rx="6" fill="#0f172a" stroke="#22c55e"/>
    <text x="140" y="155" fill="#22c55e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Offline SQLite WAL Outbox</text>

    <rect x="25" y="180" width="230" height="40" rx="6" fill="#0f172a" stroke="#a855f7"/>
    <text x="140" y="205" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Windows DPAPI Encrypted Vault</text>

    <text x="140" y="245" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Sync Latency: &lt;120ms</text>
  </g>

  <!-- Source 2: Jira -->
  <g transform="translate(800, 130)">
    <rect width="280" height="200" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="url(#jiraGrad)"/>
    <text x="70" y="46" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Atlassian Jira</text>
    <text x="25" y="85" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• Active Sprint Backlog</text>
    <text x="25" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• Story Point Estimation</text>
    <text x="25" y="135" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• Workflow Status Transitions</text>
    <text x="25" y="160" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">• Velocity &amp; Burndown Stats</text>
  </g>

  <!-- Connecting Lines and Arrows -->
  <path d="M 400 230 L 460 270" stroke="#f43f5e" stroke-width="3"/>
  <polygon points="460,270 450,262 454,274" fill="#f43f5e"/>

  <path d="M 800 230 L 740 270" stroke="#0284c7" stroke-width="3"/>
  <polygon points="740,270 746,274 750,262" fill="#0284c7"/>

  <!-- Lower summary bar -->
  <g transform="translate(120, 520)">
    <rect width="960" height="100" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="38" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">GUARANTEED OFFLINE FIRST RESILIENCE</text>
    <text x="30" y="65" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="13">When working on air-gapped or unstable connections, updates are queued locally in SQLite WAL with zero blocking.</text>
    <text x="30" y="86" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Automatic delta reconciliation occurs immediately when internet connectivity resumes.</text>
  </g>
</svg>

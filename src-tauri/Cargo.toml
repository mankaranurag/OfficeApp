[package]
name = "devpulse"
version = "1.4.2"
description = "DevPulse — Windows 11 Developer Cockpit & Git/Jira Intelligence Companion"
authors = ["DevPulse Engineering <team@devpulse.io>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "api-all", "system-tray" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }

# 0.4.x is the branch compatible with Tauri 1.x (raw-window-handle 0.5)
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.4"

[features]
# By default Tauri runs in production mode
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

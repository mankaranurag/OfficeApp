name: Build DevPulse Windows 11 Native App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Build Native Windows Executable & Installer via Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DevPulse v__VERSION__'
          releaseBody: 'Automated release build for DevPulse Windows 11 Native Cockpit.'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevPulse-Windows-11-x64-Binaries
          path: |
            src-tauri/target/release/devpulse.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
